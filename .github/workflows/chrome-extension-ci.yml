name: Chrome Extension CI

on:
  pull_request:
    branches: [main, staging]
    paths:
      - "chrome-extension/**"
      - ".github/workflows/chrome-extension-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: chrome-extension/package-lock.json

      - name: Install dependencies
        working-directory: chrome-extension
        run: npm ci

      - name: Type check
        working-directory: chrome-extension
        run: npm run type-check

      - name: Audit dependencies for vulnerabilities
        working-directory: chrome-extension
        run: npm audit --audit-level=moderate

      - name: Build extension
        working-directory: chrome-extension
        run: npm run build

      - name: Verify manifest.json is present in dist
        working-directory: chrome-extension
        run: test -f dist/manifest.json

      - name: Upload built extension as artifact
        uses: actions/upload-artifact@v7
        with:
          name: chrome-extension-dist-${{ github.sha }}
          path: chrome-extension/dist/
          retention-days: 14
