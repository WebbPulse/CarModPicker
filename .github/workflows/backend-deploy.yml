# Pushes matching paths below build and deploy the backend. AWS resources (Lambda, the
# artifacts bucket, IAM, etc.) must already exist in Terraform state.
#
# The GitHub Environment is selected from the branch: main -> production, staging -> staging.
# Every deploy-time value (role ARN, workspace id, function name, bucket) comes from that
# Environment's variables, so a staging push can never pick up production values.
#
# Ordering guarantee: the Lambda zip builds and uploads immediately (no conflict with
# Terraform), but before touching the function the job waits for any active HCP Terraform
# run on the workspace to reach a terminal state, so a code update never races an
# in-flight configuration change.
#
# Requires GitHub Actions secret: TFC_API_TOKEN (a Terraform Cloud user/team token).
#
# Concurrency: one deploy per branch at a time. A second push queues rather than
# cancels, so no deploy is ever silently skipped.
name: Backend Deploy

on:
  push:
    branches: [main, staging]
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: backend-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    env:
      AWS_REGION: us-west-2
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TFC_WORKSPACE_ID: ${{ vars.TFC_WORKSPACE_ID }}
      LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
      LAMBDA_ARTIFACTS_BUCKET: ${{ vars.LAMBDA_ARTIFACTS_BUCKET }}
      LAMBDA_ARTIFACT_KEY: lambda/${{ github.sha }}.zip

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # Pure-Python plus manylinux wheels only, resolved for the Lambda runtime
      # (x86_64, Python 3.13, Amazon Linux 2023). Two platform tags because pip
      # does not widen an explicit --platform: most wheels are manylinux2014,
      # Pillow ships manylinux_2_28 only.
      - name: Build Lambda package
        working-directory: backend
        run: |
          rm -rf build/lambda build/lambda.zip
          mkdir -p build/lambda
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements-lambda.txt \
            --platform manylinux2014_x86_64 \
            --platform manylinux_2_28_x86_64 \
            --only-binary=:all: \
            --python-version 3.13 \
            --target build/lambda
          cp -R app build/lambda/app
          find build/lambda -name "__pycache__" -type d -prune -exec rm -rf {} +
          (cd build/lambda && zip -q -r ../lambda.zip .)
          ls -l build/lambda.zip

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Upload runs in parallel with any active Terraform run — the artifacts
      # bucket is independent of Lambda state.
      - name: Upload Lambda package
        run: |
          aws s3 cp backend/build/lambda.zip "s3://$LAMBDA_ARTIFACTS_BUCKET/$LAMBDA_ARTIFACT_KEY"

      # Wait for HCP Terraform to finish before touching Lambda.
      # Polls every 15 s for up to 10 min (40 attempts).
      - name: Wait for Terraform run to complete
        env:
          TFC_API_TOKEN: ${{ secrets.TFC_API_TOKEN }}
        run: |
          TERMINAL="applied planned_and_finished discarded errored canceled force_canceled"
          echo "Polling HCP Terraform workspace $TFC_WORKSPACE_ID for active runs..."
          for i in $(seq 1 40); do
            RESPONSE=$(curl -sfg \
              -H "Authorization: Bearer $TFC_API_TOKEN" \
              -H "Content-Type: application/vnd.api+json" \
              "https://app.terraform.io/api/v2/workspaces/$TFC_WORKSPACE_ID/runs?page[size]=1")
            STATUS=$(echo "$RESPONSE" | python3 -c "
          import sys, json
          runs = json.load(sys.stdin).get('data', [])
          print(runs[0]['attributes']['status'] if runs else 'no_runs')
          ")
            echo "  Attempt $i/40 — Terraform run status: $STATUS"
            if echo "$TERMINAL" | grep -qw "$STATUS" || [ "$STATUS" = "no_runs" ]; then
              echo "Terraform is idle. Proceeding."
              break
            fi
            if [ "$i" -eq 40 ]; then
              echo "Timed out waiting for Terraform (last status: $STATUS)."
              exit 1
            fi
            sleep 15
          done

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --s3-bucket "$LAMBDA_ARTIFACTS_BUCKET" \
            --s3-key "$LAMBDA_ARTIFACT_KEY" \
            --query 'CodeSha256' --output text
          aws lambda wait function-updated --function-name "$LAMBDA_FUNCTION_NAME"
          aws lambda publish-version \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --description "${{ github.sha }}" \
            --query 'Version' --output text

