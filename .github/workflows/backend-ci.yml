name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov pytest-xdist black isort pyright bandit pip-audit

      - name: Run linting
        run: |
          cd backend
          black --check --diff .

      - name: Check import sorting
        run: |
          cd backend
          isort . --check-only --diff

      - name: Run type checking
        run: |
          cd backend
          pyright

      - name: Run security scan
        run: |
          cd backend
          # Run Bandit security scanner
          # First pass: Show all issues for visibility (low, medium, high)
          # -r app: Recursively scan app directory
          # Bandit auto-detects .bandit config file in the current directory
          # -ll: Report all severity levels (for visibility)
          # The config file skips known false positives (B404, B603, B607)
          # Individual instances are suppressed with # nosec comments
          echo "=== Bandit Security Scan (All Issues - Informational) ==="
          bandit -r app -ll || true
          echo ""
          # Second pass: Only fail on medium/high severity issues
          # -s MEDIUM: Only report and fail on medium/high severity issues
          # This will exit with code 1 only if medium or high severity issues are found
          echo "=== Bandit Security Scan (Medium/High Severity - Failing) ==="
          bandit -r app -s MEDIUM

      - name: Scan dependencies for vulnerabilities
        run: |
          cd backend
          pip-audit -r requirements.txt

      - name: Run tests with coverage
        env:
          SECRET_KEY: test-secret-key-for-ci
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
          ALLOWED_ORIGINS: http://localhost:3000,http://localhost:4000
          DEBUG: true
          PROJECT_NAME: CarModPicker API
          API_STR: /api
          SENDGRID_API_KEY: test-key
          EMAIL_FROM: test@example.com
          SENDGRID_VERIFY_EMAIL_TEMPLATE_ID: test-verify-template
          SENDGRID_RESET_PASSWORD_TEMPLATE_ID: test-reset-template
        run: |
          cd backend
          python -m pytest -n auto --cov=app --cov-report=xml --cov-report=term-missing
