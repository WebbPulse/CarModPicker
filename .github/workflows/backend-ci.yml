name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov pytest-xdist black==26.3.1 isort==6.0.1 pyright bandit pip-audit

      - name: Run linting
        run: |
          cd backend
          echo "=== Black and Python version (CI) ==="
          black --version
          python --version
          echo "=== CWD ==="
          pwd
          echo "=== Run Black with explicit config (match backend pyproject.toml) ==="
          black --config pyproject.toml --line-length 120 --target-version py311 --check --diff .

      - name: Check import sorting
        run: |
          cd backend
          isort . --check-only --diff

      - name: Run type checking
        run: |
          cd backend
          pyright

      - name: Run security scan
        run: |
          cd backend
          # Run Bandit security scanner
          # First pass: Show all issues for visibility (low, medium, high)
          # -r app: Recursively scan app directory
          # Bandit auto-detects .bandit config file in the current directory
          # -ll: Report all severity levels (for visibility)
          # The config file skips known false positives (B404, B603, B607)
          # Individual instances are suppressed with # nosec comments
          echo "=== Bandit Security Scan (All Issues - Informational) ==="
          bandit -r app -ll || true
          echo ""
          # Second pass: Only fail on medium/high severity issues
          echo "=== Bandit Security Scan (Medium/High Severity - Failing) ==="
          bandit -r app -ll

      - name: Scan dependencies for vulnerabilities
        run: |
          cd backend
          # Ignore ecdsa CVE-2024-23342: Not exploitable in this codebase as we use HS256 (HMAC) algorithm, not ECDSA-based algorithms
          pip-audit -r requirements.txt --ignore-vuln CVE-2024-23342

      - name: Run tests with coverage
        env:
          SECRET_KEY: test-secret-key-for-ci
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
          ALLOWED_ORIGINS: http://localhost:3000,http://localhost:4000
          DEBUG: true
          PROJECT_NAME: CarModPicker API
          API_STR: /api
          SENDGRID_API_KEY: test-key
          EMAIL_FROM: test@example.com
          SENDGRID_VERIFY_EMAIL_TEMPLATE_ID: test-verify-template
          SENDGRID_RESET_PASSWORD_TEMPLATE_ID: test-reset-template
        run: |
          cd backend
          python -m pytest -n auto --cov=app --cov-report=xml --cov-report=term-missing
