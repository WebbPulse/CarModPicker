name: Frontend Deploy

on:
  push:
    branches: [main, staging]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-env:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
      s3-bucket: ${{ vars.FRONTEND_S3_BUCKET }}
      cloudfront-distribution-id: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      build-env-json: ${{ steps.pick.outputs.build-env-json }}
    steps:
      - id: pick
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: |
          set -euo pipefail
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
          else
            echo "environment=staging" >> "$GITHUB_OUTPUT"
          fi

          BUILD_ENV=$(python3 -c 'import json, os; print(json.dumps({
              "VITE_API_URL": os.environ["VITE_API_URL"],
              "VITE_ALLOWED_EXTENSION_IDS": os.environ["CWS_EXTENSION_ID"],
          }))')
          echo "build-env-json=$BUILD_ENV" >> "$GITHUB_OUTPUT"

  deploy:
    needs: resolve-env
    uses: WebbPulse/.github/.github/workflows/spa-deploy.yml@6ebb7773f8ce80ab9cfb1c7e11833ef39a6e96f1 # v2.3.0
    permissions:
      id-token: write
      contents: read
    with:
      environment: ${{ needs.resolve-env.outputs.environment }}
      node-version: "22"
      working-directory: frontend
      cache-dependency-path: frontend/package-lock.json
      build-env-json: ${{ needs.resolve-env.outputs.build-env-json }}
      s3-bucket: ${{ needs.resolve-env.outputs.s3-bucket }}
      cloudfront-distribution-id: ${{ needs.resolve-env.outputs.cloudfront-distribution-id }}
      invalidation-paths: >-
        /about /about/ /pricing /pricing/ /support /support/
        /contact-us /contact-us/ /privacy-policy /privacy-policy/
        /terms-of-service /terms-of-service/ /robots.txt /sitemap.xml
      aws-region: us-west-2
      concurrency-group: frontend-deploy-${{ github.ref_name }}
      codeartifact-domain: webbpulse
      codeartifact-repository: npm
      codeartifact-namespace: "@webbpulse"
      tfc-organization: WebbPulse
      tfc-workspace: ${{ github.ref_name == 'main' && 'CarModPicker' || 'CarModPicker-staging' }}
    secrets:
      role-to-assume: ${{ needs.resolve-env.outputs.role-to-assume }}
      codeartifact-domain-owner: ${{ vars.CODEARTIFACT_DOMAIN_OWNER }}
      tfc-api-token: ${{ secrets.TFC_API_TOKEN }}
