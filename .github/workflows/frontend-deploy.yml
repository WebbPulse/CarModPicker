# Pushes matching paths below build and sync the frontend to S3/CloudFront.
# S3/CloudFront resources must already exist in Terraform state.
#
# Ordering guarantee: the npm build runs immediately (no conflict with Terraform), but
# before syncing to S3 the job waits for any active HCP Terraform run on the
# CarModPicker workspace to reach a terminal state. This prevents partial deploys
# against infrastructure that is mid-update.
#
# Requires GitHub Actions secret: TFC_API_TOKEN (a Terraform Cloud user/team token).
name: Frontend Deploy

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    env:
      AWS_REGION: us-west-2
      # HCP Terraform workspace — update if the workspace is ever renamed.
      TFC_WORKSPACE_ID: ws-oh1VvpTBPxmcrSYD

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Build runs in parallel with any active Terraform run — it is purely local.
      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: https://api.carmodpicker.com
          # Allowlist for the /extension-auth token hand-off. Without this, the
          # page refuses to send the JWT to any extension in production builds.
          VITE_ALLOWED_EXTENSION_IDS: ${{ vars.CWS_EXTENSION_ID }}
        run: npm run build

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Wait for HCP Terraform to finish before touching S3/CloudFront.
      # Polls every 15 s for up to 10 min (40 attempts).
      - name: Wait for Terraform run to complete
        env:
          TFC_API_TOKEN: ${{ secrets.TFC_API_TOKEN }}
        run: |
          TERMINAL="applied planned_and_finished discarded errored canceled force_canceled"
          echo "Polling HCP Terraform workspace $TFC_WORKSPACE_ID for active runs..."
          for i in $(seq 1 40); do
            RESPONSE=$(curl -sfg \
              -H "Authorization: Bearer $TFC_API_TOKEN" \
              -H "Content-Type: application/vnd.api+json" \
              "https://app.terraform.io/api/v2/workspaces/$TFC_WORKSPACE_ID/runs?page[size]=1")
            STATUS=$(echo "$RESPONSE" | python3 -c "
          import sys, json
          runs = json.load(sys.stdin).get('data', [])
          print(runs[0]['attributes']['status'] if runs else 'no_runs')
          ")
            echo "  Attempt $i/40 — Terraform run status: $STATUS"
            if echo "$TERMINAL" | grep -qw "$STATUS" || [ "$STATUS" = "no_runs" ]; then
              echo "Terraform is idle. Proceeding."
              break
            fi
            if [ "$i" -eq 40 ]; then
              echo "Timed out waiting for Terraform (last status: $STATUS)."
              exit 1
            fi
            sleep 15
          done

      - name: Sync to S3
        env:
          FRONTEND_BUCKET: ${{ vars.FRONTEND_S3_BUCKET }}
        run: |
          aws s3 sync frontend/dist/ s3://$FRONTEND_BUCKET/ --delete

      - name: Invalidate CloudFront cache
        if: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $CLOUDFRONT_DISTRIBUTION_ID \
            --paths "/*"
