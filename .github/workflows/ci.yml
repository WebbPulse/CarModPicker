name: CI

on:
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      chrome-extension: ${{ steps.filter.outputs.chrome-extension }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            chrome-extension:
              - 'chrome-extension/**'
              - '.github/workflows/ci.yml'
            scripts:
              - 'scripts/**'
              - '.github/workflows/ci.yml'

  scripts:
    name: Scripts
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.10"
          python-version: "3.13"

      - name: Test the route key resolver
        run: uv run --no-project --with pytest python -m pytest scripts/test_expected_route_key.py -q

      - name: Test the identity smoke expectations
        run: uv run --no-project --with pytest python -m pytest scripts/test_identity_smoke.py -q

  affected:
    name: Resolve the affected domains
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      domains: ${{ steps.affected.outputs.domains }}
      shared: ${{ steps.affected.outputs.shared }}
      reason: ${{ steps.affected.outputs.reason }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # An all-zero sha is what a push event reports for a branch's first push, and
      # it resolves to nothing, so it is passed through as an empty base, which the
      # action reports as unknown and answers with every domain.
      - name: Resolve the base commit
        id: base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          BASE="${PR_BASE_SHA:-$PUSH_BEFORE_SHA}"
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=""
          fi
          if [ -n "$BASE" ] && ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE" || true
          fi
          echo "Base: ${BASE:-none, so every domain}"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"

      # ci.yml is deliberately not in extra-full-paths: a change to the CI workflow
      # cannot change which tests cover which domain, and the changes job already
      # gates the backend job on it, so a workflow-only pull request runs lint, type
      # check and security over the whole tree and no test shard.
      - name: Work out the affected domains
        id: affected
        uses: WebbPulse/.github/actions/affected-domains@v3
        with:
          working-directory: backend
          base: ${{ steps.base.outputs.base }}
          head: ${{ github.sha }}
          mode: ci

  backend:
    name: Backend
    needs: [changes, affected]
    if: needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
      id-token: write
    uses: WebbPulse/.github/.github/workflows/python-ci.yml@v3
    with:
      python-version: "3.13"
      working-directory: backend
      install-command: >-
        uv lock --check &&
        uv lock --upgrade-package webbpulse &&
        uv sync --locked &&
        uv run --no-sync python -c
        'import importlib.metadata as m; print("webbpulse", m.version("webbpulse"))'
      ruff-target: "app tests scripts"
      typecheck-command: pyright
      security-commands: |
        bandit -r app -ll
        uv export --frozen --no-dev --no-emit-project --no-hashes --no-emit-package webbpulse -o /tmp/requirements-audit.txt && pip-audit --no-deps -r /tmp/requirements-audit.txt --ignore-vuln CVE-2024-23342
      pytest-args: "--dist=loadfile"
      pytest-workers: auto
      coverage-source: app
      domains-filter: ${{ needs.affected.outputs.domains }}
      run-shared: ${{ needs.affected.outputs.shared == 'true' }}
      test-env-json: |
        {
          "SECRET_KEY": "test-secret-key-for-ci",
          "ACCESS_TOKEN_EXPIRE_MINUTES": "30",
          "ALLOWED_ORIGINS": "http://localhost:3000,http://localhost:4000",
          "DEBUG": "true",
          "API_STR": "/api",
          "EMAIL_FROM": "test@example.com"
        }
      codeartifact-domain: webbpulse
      codeartifact-index: codeartifact
      aws-region: us-west-2
    secrets:
      role-to-assume: ${{ vars.CI_AWS_ROLE_ARN }}
      codeartifact-domain-owner: ${{ vars.CODEARTIFACT_DOMAIN_OWNER }}

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
      id-token: write
    uses: WebbPulse/.github/.github/workflows/typescript-ci.yml@v3
    with:
      node-version: "22"
      working-directory: frontend
      install-command: |
        npm ci && npm update $(node -p "const p=require('./package.json');Object.keys({...p.dependencies,...p.devDependencies}).filter(n=>n.startsWith('@webbpulse/')).join(' ')") && { npm ls --depth=0 2>/dev/null | grep @webbpulse || true; }
      lint-command: npm run lint
      format-check-command: npm run format:check
      typecheck-command: ""
      test-command: npm run test:run -- --coverage
      build-command: npm run build
      codeartifact-domain: webbpulse
      codeartifact-repository: npm
      codeartifact-namespace: "@webbpulse"
      aws-region: us-west-2
    secrets:
      role-to-assume: ${{ vars.CI_AWS_ROLE_ARN }}
      codeartifact-domain-owner: ${{ vars.CODEARTIFACT_DOMAIN_OWNER }}

  frontend-audit-and-imports:
    name: Frontend audit and imports
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Audit dependencies for vulnerabilities
        working-directory: frontend
        run: npm audit --audit-level=moderate

      - name: Check circular imports
        working-directory: frontend
        run: npx --yes madge --circular --extensions ts,tsx src/

  chrome-extension:
    name: Chrome extension
    needs: changes
    if: needs.changes.outputs.chrome-extension == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: chrome-extension/package-lock.json

      - name: Install dependencies
        working-directory: chrome-extension
        run: npm ci

      - name: Type check
        working-directory: chrome-extension
        run: npm run type-check

      - name: Unit tests
        working-directory: chrome-extension
        run: npm test

      - name: Audit dependencies for vulnerabilities
        working-directory: chrome-extension
        run: npm audit --audit-level=moderate

      - name: Build extension
        working-directory: chrome-extension
        run: npm run build

      - name: Verify manifest.json is present in dist
        working-directory: chrome-extension
        run: test -f dist/manifest.json

      - name: Verify the API hosts stay in host_permissions
        working-directory: chrome-extension
        run: node scripts/check-host-permissions.js

      - name: Upload built extension as artifact
        uses: actions/upload-artifact@v7
        with:
          name: chrome-extension-dist-${{ github.sha }}
          path: chrome-extension/dist/
          retention-days: 14

  e2e-local:
    name: E2E on a local stack
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
      id-token: write
      checks: write
    uses: WebbPulse/.github/.github/workflows/e2e-local.yml@v3
    with:
      working-directory: backend
      install-command: >-
        uv sync --locked --group e2e &&
        uv run --no-sync python -c "import importlib.metadata as m; print('webbpulse', m.version('webbpulse'))"
      pytest-args: "-o addopts="
      codeartifact-domain: webbpulse
      codeartifact-repository: npm
      codeartifact-namespace: "@webbpulse"
      aws-region: us-west-2
      frontend-directory: frontend
      frontend-build-env-json: >-
        {"VITE_API_URL": "http://127.0.0.1:8000"}
      preview-command: npx vite preview --host 127.0.0.1 --port 5173
      web-base-url: http://127.0.0.1:5173
      backend-env-json: >-
        {
          "APP_ENVIRONMENT": "local",
          "DEBUG": "true",
          "LOG_LEVEL": "INFO",
          "AWS_ACCESS_KEY_ID": "local",
          "AWS_SECRET_ACCESS_KEY": "local",
          "AWS_DEFAULT_REGION": "us-west-2",
          "DYNAMODB_ENDPOINT_URL": "http://127.0.0.1:8001",
          "DYNAMODB_TABLE_PREFIX": "carmodpicker-e2e-local",
          "SECRET_KEY": "e2e-local-stack-secret-key",
          "API_STR": "/api",
          "ENABLE_RATE_LIMITING": "false",
          "RUN_STARTUP_TASKS": "false",
          "ALLOWED_ORIGINS": "http://127.0.0.1:5173",
          "FRONTEND_URL": "http://127.0.0.1:5173",
          "API_URL": "http://127.0.0.1:8000",
          "USER_IMAGES_BUCKET": "carmodpicker-e2e-local-images",
          "IDENTITY_ENVIRONMENT": "local",
          "IDENTITY_ISSUER": "http://127.0.0.1:8000/api/auth",
          "IDENTITY_AUDIENCE": "carmodpicker-local-api",
          "IDENTITY_SIGNER": "local",
          "IDENTITY_SIGNING_KEY_ARNS": "[\"local\"]",
          "IDENTITY_COOKIE_SECURE": "false",
          "IDENTITY_COOKIE_SAMESITE": "lax",
          "IDENTITY_REGISTRATION_ENABLED": "true",
          "IDENTITY_EPHEMERAL_USERS_ENABLED": "true",
          "IDENTITY_PASSKEYS_ENABLED": "true",
          "IDENTITY_EMAIL_FROM": "",
          "IDENTITY_RP_ID": "127.0.0.1",
          "IDENTITY_RP_NAME": "CarModPicker local",
          "IDENTITY_WEBAUTHN_ORIGINS": "[\"http://127.0.0.1:5173\"]",
          "IDENTITY_GOOGLE_CLIENT_ID": "local-stack-google-client-id",
          "IDENTITY_GITHUB_CLIENT_ID": "local-stack-github-client-id",
          "IDENTITY_OAUTH_REDIRECT_URIS": "[\"http://127.0.0.1:8000/api/auth/oauth/callback\"]",
          "OAUTH_GOOGLE_CLIENT_SECRET": "local-stack-google-client-secret",
          "OAUTH_GITHUB_CLIENT_SECRET": "local-stack-github-client-secret",
          "E2E_USER_EMAIL": "e2e-local-user@carmodpicker.com",
          "E2E_USER_PASSWORD": "E2eLocalStackPassw0rd"
        }
      backend-start-command: >-
        uv run --no-sync uvicorn app.common.composition.app:app --host 127.0.0.1 --port 8000
      api-base-url: http://127.0.0.1:8000
      health-path: /health
      table-bootstrap-command: >-
        uv run --no-sync python scripts/create_dynamo_tables.py &&
        uv run --no-sync python scripts/create_local_e2e_user.py
      dynamodb-port: 8001
      check-name: "e2e (local)"
    secrets:
      role-to-assume: ${{ vars.CI_AWS_ROLE_ARN }}
      codeartifact-domain-owner: ${{ vars.CODEARTIFACT_DOMAIN_OWNER }}

  all-checks-passed:
    name: all-checks-passed
    runs-on: ubuntu-latest
    needs:
      - changes
      - affected
      - backend
      - frontend
      - frontend-audit-and-imports
      - chrome-extension
      - scripts
    if: always()
    steps:
      - name: Fail unless every upstream job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"result": *"(failure|cancelled)"'; then
            echo "::error::at least one upstream job failed or was cancelled"
            exit 1
          fi
          echo "Every upstream job succeeded or was skipped."
