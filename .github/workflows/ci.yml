name: CI

on:
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      chrome-extension: ${{ steps.filter.outputs.chrome-extension }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            chrome-extension:
              - 'chrome-extension/**'
              - '.github/workflows/ci.yml'
            scripts:
              - 'scripts/**'
              - '.github/workflows/ci.yml'

  scripts:
    name: Scripts
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Check shell syntax
        run: bash -n scripts/verify_route_cut.sh

      - name: Test the route key resolver
        run: python -m pytest scripts/test_expected_route_key.py -q

      - name: Test the identity smoke expectations
        run: python -m pytest scripts/test_identity_smoke.py -q

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
      id-token: write
    uses: WebbPulse/.github/.github/workflows/python-ci.yml@v2
    with:
      python-version: "3.13"
      working-directory: backend
      install-command: >-
        python -m pip install --upgrade pip &&
        pip install -r requirements.txt &&
        pip install pytest-cov pytest-xdist pyright bandit pip-audit
      ruff-target: "app tests scripts"
      typecheck-command: pyright
      security-commands: |
        bandit -r app -ll
        pip-audit -r requirements.txt --ignore-vuln CVE-2024-23342
      pytest-args: "--dist=loadfile"
      pytest-workers: auto
      coverage-source: app
      test-env-json: |
        {
          "SECRET_KEY": "test-secret-key-for-ci",
          "ACCESS_TOKEN_EXPIRE_MINUTES": "30",
          "ALLOWED_ORIGINS": "http://localhost:3000,http://localhost:4000",
          "DEBUG": "true",
          "API_STR": "/api",
          "EMAIL_FROM": "test@example.com"
        }
      codeartifact-domain: webbpulse
      codeartifact-repository: python
      aws-region: us-west-2
    secrets:
      role-to-assume: ${{ vars.CI_AWS_ROLE_ARN }}
      codeartifact-domain-owner: ${{ vars.CODEARTIFACT_DOMAIN_OWNER }}

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
      id-token: write
    uses: WebbPulse/.github/.github/workflows/typescript-ci.yml@v2
    with:
      node-version: "22"
      working-directory: frontend
      lint-command: npm run lint
      format-check-command: npm run format:check
      typecheck-command: ""
      test-command: npm run test:run -- --coverage
      build-command: npm run build
      codeartifact-domain: webbpulse
      codeartifact-repository: npm
      aws-region: us-west-2
    secrets:
      role-to-assume: ${{ vars.CI_AWS_ROLE_ARN }}
      codeartifact-domain-owner: ${{ vars.CODEARTIFACT_DOMAIN_OWNER }}

  frontend-audit-and-imports:
    name: Frontend audit and imports
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Audit dependencies for vulnerabilities
        working-directory: frontend
        run: npm audit --audit-level=moderate

      - name: Check circular imports
        working-directory: frontend
        run: npx --yes madge --circular --extensions ts,tsx src/

  chrome-extension:
    name: Chrome extension
    needs: changes
    if: needs.changes.outputs.chrome-extension == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: chrome-extension/package-lock.json

      - name: Install dependencies
        working-directory: chrome-extension
        run: npm ci

      - name: Type check
        working-directory: chrome-extension
        run: npm run type-check

      - name: Unit tests
        working-directory: chrome-extension
        run: npm test

      - name: Audit dependencies for vulnerabilities
        working-directory: chrome-extension
        run: npm audit --audit-level=moderate

      - name: Build extension
        working-directory: chrome-extension
        run: npm run build

      - name: Verify manifest.json is present in dist
        working-directory: chrome-extension
        run: test -f dist/manifest.json

      - name: Verify the API hosts stay in host_permissions
        working-directory: chrome-extension
        run: node scripts/check-host-permissions.js

      - name: Upload built extension as artifact
        uses: actions/upload-artifact@v7
        with:
          name: chrome-extension-dist-${{ github.sha }}
          path: chrome-extension/dist/
          retention-days: 14

  all-checks-passed:
    name: all-checks-passed
    runs-on: ubuntu-latest
    needs:
      - changes
      - backend
      - frontend
      - frontend-audit-and-imports
      - chrome-extension
      - scripts
    if: always()
    steps:
      - name: Fail unless every upstream job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"result": *"(failure|cancelled)"'; then
            echo "::error::at least one upstream job failed or was cancelled"
            exit 1
          fi
          echo "Every upstream job succeeded or was skipped."
