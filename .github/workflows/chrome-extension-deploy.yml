name: Chrome Extension Deploy

on:
  push:
    branches: [main]
    paths:
      - "chrome-extension/**"
      - ".github/workflows/chrome-extension-deploy.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: chrome-extension-release
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      allowed: ${{ steps.decide.outputs.allowed }}
    steps:
      - name: Decide whether this event is allowed to release
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          AUTO_RELEASE: ${{ vars.CHROME_EXTENSION_AUTO_RELEASE }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: releasing regardless of CHROME_EXTENSION_AUTO_RELEASE."
            echo "Manual dispatch, so the release hold does not apply." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$AUTO_RELEASE" == "true" ]]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "CHROME_EXTENSION_AUTO_RELEASE is true: this push may release."
            echo "CHROME_EXTENSION_AUTO_RELEASE is \`true\`, so this push may release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "allowed=false" >> "$GITHUB_OUTPUT"
          echo "CHROME_EXTENSION_AUTO_RELEASE is not 'true' (value: '${AUTO_RELEASE:-unset}'). Holding the release."
          {
            echo "### Chrome extension release held"
            echo
            echo "\`CHROME_EXTENSION_AUTO_RELEASE\` is \`${AUTO_RELEASE:-unset}\`, not \`true\`, so this push did not publish."
            echo
            echo "This is the expected state. The locked decision is a single publish after the"
            echo "production identity cutover, carrying \`DEFAULT_AUTH_MODE\` = identity."
            echo
            echo "To release: set the \`production\` environment variable"
            echo "\`CHROME_EXTENSION_AUTO_RELEASE\` to \`true\` and re-run, or run this workflow"
            echo "manually with **Run workflow**, which is never gated. See step 14 of"
            echo "\`docs/prod-promotion-plan.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

  changes:
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Decide whether the extension source changed since the last release
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Manual dispatch, releasing regardless of source changes."
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --tags --force --quiet
          LAST_TAG=$(git tag -l 'chrome-extension-v*' \
            | sed 's/^chrome-extension-v//' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n 1 || true)

          if [[ -z "$LAST_TAG" ]]; then
            echo "No release tag yet, releasing."
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "chrome-extension-v$LAST_TAG" HEAD -- \
               chrome-extension ':(exclude)chrome-extension/manifest.json'; then
            echo "Only manifest.json (or nothing) changed under chrome-extension/ since chrome-extension-v$LAST_TAG. Skipping release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Extension source changed since chrome-extension-v$LAST_TAG, releasing."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: [gate, changes]
    if: needs.gate.outputs.allowed == 'true' && needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Derive next version from the newest release tag
        id: version
        run: |
          set -euo pipefail

          git fetch --tags --force --quiet

          LAST_TAG=$(git tag -l 'chrome-extension-v*' \
            | sed 's/^chrome-extension-v//' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n 1 || true)

          if [[ -n "$LAST_TAG" ]]; then
            BASE="$LAST_TAG"
            echo "Newest release tag: chrome-extension-v$LAST_TAG"
          else
            BASE=$(node -p "require('./chrome-extension/manifest.json').version")
            if [[ ! "$BASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::manifest.json version is not a valid semver: $BASE"
              exit 1
            fi
            echo "No chrome-extension-v* tag found; falling back to manifest version $BASE"
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          NEW="$MAJOR.$MINOR.$((PATCH + 1))"

          {
            echo "last=$LAST_TAG"
            echo "base=$BASE"
            echo "new=$NEW"
            echo "tag=chrome-extension-v$NEW"
          } >> "$GITHUB_OUTPUT"

          echo "Next version: $NEW"

      - name: Verify the new version is strictly greater than the last tag
        env:
          LAST_TAG: ${{ steps.version.outputs.last }}
          NEW_VERSION: ${{ steps.version.outputs.new }}
          NEW_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          if git rev-parse -q --verify "refs/tags/$NEW_TAG" >/dev/null; then
            echo "::error::Tag $NEW_TAG already exists. Refusing to republish an existing version."
            exit 1
          fi

          if [[ -z "$LAST_TAG" ]]; then
            echo "No previous tag to compare against; $NEW_VERSION is the first tagged release."
            exit 0
          fi

          if [[ "$NEW_VERSION" == "$LAST_TAG" ]] \
            || [[ "$(printf '%s\n%s\n' "$LAST_TAG" "$NEW_VERSION" | sort -V | tail -n 1)" != "$NEW_VERSION" ]]; then
            echo "::error::Computed version $NEW_VERSION is not strictly greater than the last released version $LAST_TAG."
            exit 1
          fi

          echo "$NEW_VERSION is strictly greater than $LAST_TAG."

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: chrome-extension/package-lock.json

      - name: Install dependencies
        working-directory: chrome-extension
        run: npm ci

      - name: Patch manifest.json for the build
        working-directory: chrome-extension
        env:
          NEW_VERSION: ${{ steps.version.outputs.new }}
        run: |
          set -euo pipefail
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            m.version = process.env.NEW_VERSION;
            fs.writeFileSync('manifest.json', JSON.stringify(m, null, 2) + '\n');
          "
          echo "Build tree manifest.json set to $NEW_VERSION (not committed to main)."

      - name: Build extension
        working-directory: chrome-extension
        run: npm run build

      - name: Verify the built manifest carries the new version
        working-directory: chrome-extension
        env:
          NEW_VERSION: ${{ steps.version.outputs.new }}
        run: |
          set -euo pipefail
          BUILT=$(node -p "require('./dist/manifest.json').version")
          if [[ "$BUILT" != "$NEW_VERSION" ]]; then
            echo "::error::Built manifest version is $BUILT but expected $NEW_VERSION."
            exit 1
          fi
          echo "Built manifest version is $BUILT."

      - name: Zip extension
        id: zip
        working-directory: chrome-extension
        env:
          NEW_VERSION: ${{ steps.version.outputs.new }}
        run: |
          set -euo pipefail
          ZIP_NAME="carmodpicker-extension-$NEW_VERSION.zip"
          (cd dist && zip -r "../$ZIP_NAME" .)
          {
            echo "zip_path=chrome-extension/$ZIP_NAME"
            echo "zip_name=$ZIP_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Check Chrome Web Store credentials
        id: cws_check
        env:
          CWS_CLIENT_ID: ${{ vars.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: |
          if [[ -n "$CWS_CLIENT_ID" && -n "$CWS_CLIENT_SECRET" && -n "$CWS_REFRESH_TOKEN" && -n "$CWS_EXTENSION_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Chrome Web Store credentials not set. Skipping auto-publish."
          fi

      - name: Publish to Chrome Web Store
        if: steps.cws_check.outputs.configured == 'true'
        env:
          CWS_CLIENT_ID: ${{ vars.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          ZIP_PATH: ${{ steps.zip.outputs.zip_path }}
          NEW_VERSION: ${{ steps.version.outputs.new }}
        run: |
          set -euo pipefail

          echo "Exchanging refresh token for access token..."
          ACCESS_TOKEN=$(curl -sfg -X POST \
            -d "client_id=$CWS_CLIENT_ID" \
            -d "client_secret=$CWS_CLIENT_SECRET" \
            -d "refresh_token=$CWS_REFRESH_TOKEN" \
            -d "grant_type=refresh_token" \
            "https://oauth2.googleapis.com/token" | python3 -c "import sys,json;print(json.load(sys.stdin)['access_token'])")

          echo "Uploading new package to Chrome Web Store..."
          UPLOAD_RESPONSE=$(curl -sfg \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "x-goog-api-version: 2" \
            -X PUT \
            -T "$ZIP_PATH" \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$CWS_EXTENSION_ID")
          echo "$UPLOAD_RESPONSE"

          UPLOAD_STATE=$(echo "$UPLOAD_RESPONSE" | python3 -c "import sys,json;print(json.load(sys.stdin).get('uploadState',''))")
          if [[ "$UPLOAD_STATE" != "SUCCESS" ]]; then
            echo "::error::Upload failed with state: $UPLOAD_STATE"
            exit 1
          fi

          echo "Publishing to public channel..."
          curl -sfg \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "x-goog-api-version: 2" \
            -H "Content-Length: 0" \
            -X POST \
            "https://www.googleapis.com/chromewebstore/v1.1/items/$CWS_EXTENSION_ID/publish"

          echo "Published v$NEW_VERSION to Chrome Web Store."

      - name: Push release tag
        id: tag
        env:
          NEW_VERSION: ${{ steps.version.outputs.new }}
          NEW_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin "refs/tags/$NEW_TAG" >/dev/null 2>&1; then
            echo "Tag $NEW_TAG already exists on origin. Nothing to push."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git tag -a "$NEW_TAG" -m "Chrome extension v$NEW_VERSION"
          git push origin "refs/tags/$NEW_TAG"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "Pushed $NEW_TAG."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.zip.outputs.zip_path }}
          name: Chrome Extension v${{ steps.version.outputs.new }}
          tag_name: ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Prepare manifest bump branch for staging
        id: bookkeeping
        env:
          NEW_VERSION: ${{ steps.version.outputs.new }}
        run: |
          set -euo pipefail

          BRANCH="chore/chrome-extension-v$NEW_VERSION"

          git checkout -- chrome-extension/manifest.json
          git fetch origin staging --quiet
          git checkout -B "$BRANCH" origin/staging

          CURRENT=$(node -p "require('./chrome-extension/manifest.json').version")
          if [[ "$CURRENT" == "$NEW_VERSION" ]]; then
            echo "staging manifest.json is already at $NEW_VERSION. No bookkeeping PR needed."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          node -e "
            const fs = require('fs');
            const p = 'chrome-extension/manifest.json';
            const m = JSON.parse(fs.readFileSync(p, 'utf8'));
            m.version = process.env.NEW_VERSION;
            fs.writeFileSync(p, JSON.stringify(m, null, 2) + '\n');
          "

          git add chrome-extension/manifest.json
          git commit -m "chore(chrome-extension): record published v$NEW_VERSION"
          git push --force origin "$BRANCH"

          {
            echo "needed=true"
            echo "branch=$BRANCH"
          } >> "$GITHUB_OUTPUT"

      - name: Open bookkeeping PR against staging
        if: steps.bookkeeping.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.bookkeeping.outputs.branch }}
          NEW_VERSION: ${{ steps.version.outputs.new }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -uo pipefail

          COMPARE_URL="$SERVER_URL/$REPO/compare/staging...$BRANCH?expand=1"

          EXISTING=$(gh pr list --head "$BRANCH" --base staging --state open \
            --json url --jq '.[0].url // empty' 2>/dev/null || true)
          if [[ -n "$EXISTING" ]]; then
            echo "Bookkeeping PR already open: $EXISTING"
            {
              echo "### Chrome extension v$NEW_VERSION"
              echo
              echo "Published to the Chrome Web Store and tagged."
              echo
              echo "Bookkeeping PR already open: $EXISTING"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if PR_URL=$(gh pr create \
            --base staging \
            --head "$BRANCH" \
            --title "chore(chrome-extension): record published v$NEW_VERSION" \
            --body "Records the version published to the Chrome Web Store by the \
          Chrome Extension Deploy run for v$NEW_VERSION.

          The release itself is already live and tagged \`chrome-extension-v$NEW_VERSION\`. \
          This PR only realigns the committed \`chrome-extension/manifest.json\` with the \
          published version, so it is safe to merge at any time and safe to close if a \
          later release supersedes it." 2>/tmp/gh-pr-create.err); then
            PR_URL=$(printf '%s' "$PR_URL" | tail -n 1)
            echo "Opened bookkeeping PR: $PR_URL"
            {
              echo "### Chrome extension v$NEW_VERSION"
              echo
              echo "Published to the Chrome Web Store and tagged."
              echo
              echo "Bookkeeping PR: $PR_URL"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Could not open the bookkeeping PR automatically. Branch $BRANCH is pushed; open the PR by hand."
            cat /tmp/gh-pr-create.err || true
            {
              echo "### Chrome extension v$NEW_VERSION"
              echo
              echo "Published to the Chrome Web Store and tagged."
              echo
              echo "The bookkeeping PR could not be opened automatically, most likely"
              echo "because Actions is not allowed to create pull requests in this org."
              echo "The branch \`$BRANCH\` is pushed. Open the PR here:"
              echo
              echo "$COMPARE_URL"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
