services:
  postgres-test:
    image: postgres:16
    container_name: carmodpicker_postgres_test
    environment:
      POSTGRES_USER: cmp_test
      POSTGRES_PASSWORD: cmp_test
      POSTGRES_DB: cmp_test
    ports:
      - "5433:5432"  # Non-colliding port vs. backend/docker-compose.yml (5432)
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmp_test"]
      interval: 5s
      timeout: 3s
      retries: 10

# Usage (from repo root):
#   docker compose -f docker-compose.test.yml up -d postgres-test
#   cd backend
#   POSTGRES_TEST_URL=postgresql://cmp_test:cmp_test@localhost:5433/cmp_test \
#     pytest -n 4 -m postgres --dist=loadfile
#
# Per-worker databases (cmp_test_gw0..cmp_test_gw3) are created by the CI
# workflow's "Create per-worker databases" step. For local runs, create them
# manually with:
#   for i in 0 1 2 3; do
#     docker compose -f docker-compose.test.yml exec postgres-test \
#       psql -U cmp_test -d cmp_test -c "CREATE DATABASE cmp_test_gw${i};"
#   done
