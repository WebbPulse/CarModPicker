[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["build", "dist", "htmlcov", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E203"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.bandit]

exclude_dirs = [
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
]

skips = ["B404", "B603", "B607"]

[tool.webbpulse.ci]
test-root = "tests"

[tool.webbpulse.ci.domains]
identity = [
    "tests/auth",
    "tests/dependencies",
    "tests/utils/test_google_oauth_nonce.py",
    "tests/test_identity_row5.py",
    "tests/test_identity_row9.py",
    "tests/test_identity_row10.py",
    "tests/test_identity_row11.py",
    "tests/test_jwt_algorithm_regression.py",
]

