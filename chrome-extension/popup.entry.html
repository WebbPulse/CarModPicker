<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CarModPicker Part Scraper</title>
  <style>
    body {
      width: 400px;
      margin: 0;
      padding: 0;
      transition: width 0.2s ease;
      /* Match frontend: bg-gradient-to-br from-neutral-900 via-neutral-800 to-neutral-900 */
      background: linear-gradient(to bottom right, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      background-attachment: fixed;
      color: #f1f5f9;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }
    #root {
      width: 100%;
      min-height: 100%;
    }
    /* Background pattern overlay like frontend - opacity-5 = 0.05 */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      opacity: 0.05;
      pointer-events: none;
      background-image: 
        radial-gradient(circle at 25% 25%, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 75% 75%, rgba(139, 92, 246, 0.1) 0%, transparent 50%);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./src/main-popup.tsx"></script>
</body>
</html>
