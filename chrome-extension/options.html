<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CarModPicker Extension Settings</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      padding: 40px;
      max-width: 600px;
      margin: 0 auto;
    }
    
    h1 {
      color: #4a9eff;
      margin-bottom: 30px;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #ccc;
    }
    
    input {
      width: 100%;
      padding: 12px;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 4px;
      color: #e0e0e0;
      font-size: 14px;
      font-family: inherit;
    }
    
    input:focus {
      outline: none;
      border-color: #4a9eff;
    }
    
    .help-text {
      margin-top: 5px;
      font-size: 12px;
      color: #888;
    }
    
    button {
      padding: 12px 24px;
      background: #4a9eff;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 10px;
    }
    
    button:hover {
      background: #3a8eef;
    }
    
    .status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 4px;
      font-size: 13px;
      display: none;
    }
    
    .status.success {
      background: #2e7d32;
      color: white;
      display: block;
    }
    
    .status.error {
      background: #d32f2f;
      color: white;
      display: block;
    }
  </style>
</head>
<body>
  <h1>CarModPicker Extension Settings</h1>
  
  <div class="form-group">
    <label for="apiUrl">API Base URL</label>
    <input type="url" id="apiUrl" placeholder="https://carmodpicker.com/api">
    <div class="help-text">
      The base URL for the CarModPicker API. Default: https://carmodpicker.com/api
    </div>
  </div>
  
  <button id="saveBtn">Save Settings</button>
  
  <div id="status" class="status"></div>
  
  <script src="dist/options.js"></script>
</body>
</html>
